[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martinez-stage-qa"
version = "0.1.0"
description = "Continuous, gap-filled Martinez (mrz) water-level series pipeline"
readme = "martinez_workflow.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "dms_datastore",
    "vtools",
]

[project.scripts]
update-martinez-stage = "martinez_stage_qa.update_martinez_stage:update_martinez_stage"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
martinez_stage_qa = ["data/*.csv", "data/*.yaml"]
